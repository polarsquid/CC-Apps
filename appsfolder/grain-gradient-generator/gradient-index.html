<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grain Gradient Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Sofia+Sans+Extra+Condensed:wght@500;650;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="field" role="img"
          aria-label="Animated grainy colour gradient. Click or tap anywhere for new colours."></canvas>

  <div class="rail" id="rail">
    <div class="rail-slot">
      <button class="add" id="add-blob" type="button" aria-label="Add a colour">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <ul class="swatches" id="swatches" aria-label="Current colours"></ul>

    <div class="rail-slot">
      <button class="gear" id="open-settings" type="button" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="rail-slot">
      <button class="collapse" id="collapse-tools" type="button" aria-label="Hide tools">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <button class="reveal" id="reveal-tools" type="button" aria-label="Show tools" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <dialog class="panel" id="settings" aria-labelledby="settings-title">
    <div class="panel-head" id="settings-grip">
      <h2 id="settings-title">Settings</h2>
      <span class="grip-ridges" aria-hidden="true"></span>
      <button type="button" class="panel-switch" id="idle-switch" role="switch" aria-checked="false"
              title="Force idle (I)">
        <span class="switch-label">Idle</span>
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
      </button>
      <button type="button" class="panel-reset" id="reset-settings">Reset</button>
      <button type="button" class="panel-close" id="close-settings" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
    <div class="panel-tabs" role="tablist" aria-label="Settings sections">
      <button type="button" role="tab" class="panel-tab" id="tab-gradient"
              aria-selected="true" aria-controls="settings-body">Gradient</button>
      <button type="button" role="tab" class="panel-tab" id="tab-marks"
              aria-selected="false" aria-controls="marks-body" tabindex="-1">Marks</button>
    </div>
    <div class="banks" id="settings-body" role="tabpanel" aria-labelledby="tab-gradient"></div>
    <div class="marks-tab" id="marks-body" role="tabpanel" aria-labelledby="tab-marks" hidden>
      <div class="mark-toggles" id="mark-toggles"></div>
      <div class="banks" id="marks-banks"></div>
    </div>
    <div class="panel-resize" id="settings-resize" tabindex="0" role="separator"
         aria-label="Resize settings panel with arrow keys"></div>
  </dialog>

  <p class="hint" id="hint">Click anywhere for new colours</p>

  <p class="fallback" id="fallback" hidden>
    This browser can't draw the gradient because WebGL is turned off or unsupported.
    Try a recent version of Chrome, Firefox or Safari.
  </p>

  <div class="mark-menu" id="mark-menu" role="dialog" aria-labelledby="mark-menu-title" hidden></div>
  <input type="file" id="mark-file" accept="image/svg+xml,image/png,image/jpeg,image/webp" hidden>

  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <script src="marks.js"></script>
  <script src="script.js"></script>
</body>
</html>
